[package]
name = "folio"
version = "0.3.0"
description = "Folio, a book-skinned desktop client for the opencode server."
authors = ["Folio"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
